<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Forgeline</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--forge); }
  .tint { fill:var(--forge-soft); }
  .steel { fill:var(--staalgrijs); }
  .deep { fill:var(--ink); }
  .blk { rx:var(--radius-md); }
  .plus { stroke:var(--line-strong); stroke-width:2; }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:80px; line-height:.92; font-weight:700; letter-spacing:-0.01em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 3px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">

  arrangement one tall forge slab with satellites, bottoms on one line space-16 above the edge, space-4 gutters
  pattern     plus grid at a space-6 pitch, from "precies, technisch, bouwtekening-raster" (README Beeld): two rows along the bottom, like a blueprint margin
